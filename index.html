<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f9">
    <title>GEWIS Status</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="page">
        <header class="site-header">
            <img src="logo.svg" alt="GEWIS" class="brand-logo">
            <div class="brand-text">
                <span class="brand-name">GEWIS</span>
                <span class="brand-sub">Service Status</span>
            </div>
        </header>

        <main>
            <section id="status-banner" class="status-banner" data-status="loading" aria-live="polite">
                <div class="status-icon" id="status-icon" aria-hidden="true"></div>
                <div class="status-text">
                    <span class="status-label" id="status-label">Checking status</span>
                    <h1 id="status-title">Loading status…</h1>
                    <p class="status-meta">Updated <time id="last-updated">—</time></p>
                </div>
            </section>

            <p class="notice">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
                <span>This page is updated by hand and might differ from reality. For live monitoring, visit <a href="https://uptime.gewis.nl">uptime.gewis.nl</a> (EduVPN or campus only).</span>
            </p>

            <div id="status-content" class="sections">
                <div class="card skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
                <div class="card skeleton" aria-hidden="true"><span></span><span></span><span></span></div>
            </div>
        </main>

        <footer class="site-footer">
            <p>Refreshes automatically every 5 minutes</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
